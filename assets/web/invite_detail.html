<html>

<head>
    <title>邀请详情</title>
    <meta charset='utf-8'>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes" /><!-- 删除苹果默认的工具栏和菜单栏 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" /><!-- 设置苹果工具栏颜色 -->
    <meta name="format-detection" content="telephone=no, email=no" />
    <!--忽略页面中的数字识别为电话，忽略email识别 -->
    <link rel="stylesheet" type="text/css" href="css/index.css" />
    <script type="text/javascript" src="js/config.js"></script>
    <script type="text/javascript" src="js/jquery-3.4.1.min.js"></script>
    <script type="text/javascript" src="js/IMJSBridge.js"></script>
    <script type="text/javascript" src="js/index.js"></script>
    <style type="text/css">
        .top {
            display: flex;
            align-items: center;
            flex-direction: column;
            height: 200px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 4px;
            margin-top: 40px;
        }

        .inviter {
            margin-top: 5px;
        }

        .tip {
            margin-top: 15px;
        }

        .remark {
            margin-top: 5px;
        }

        .line {
            background-color: #eee;
            height: 1;
            margin: 20px 20px;
        }

        .members {
            display: flex;
            justify-content: center;
            padding: 0px 20px;
            flex-wrap: wrap-reverse;
        }

        .member {
            width: 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .member img {
            width: 48px;
            height: 48px;
            border-radius: 4px;
        }

        .member .name {
            font-size: 12px;
            text-align: center;
            width: 48px;
            color: gray;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="top">
            <img class="avatar" />
            <div class="inviter"></div>
            <div class="tip"></div>
            <div class="remark"></div>
        </div>
        <div class="line"></div>
        <div class="bottom">
            <div class="members">
            </div>
            <div id="status" style="text-align: center; margin: 30px 20px 0px 20px; color: gray;"></div>
            <div id="actions" style="display: flex; margin: 30px 20px 20px 20px;">
                <div id="refuse" class="button danger" style="flex: 1; margin-right: 10px;">拒绝</div>
                <div id="ok" class="button primary" style="flex: 1; margin-left: 10px;">同意</div>
            </div>
        </div>
    </div>
</body>
<script language="javascript">
    let inviteNo = getQueryString('invite_no');
    let code = getQueryString('auth_code');

    function disableActions() {
        $("#refuse").addClass('disabled').off('click');
        $("#ok").addClass('disabled').off('click');
    }

    // 关闭/退出当前页面：
    // - 原生 WebView（iOS/Android）：调用 IMJSBridge 的 quit -> 由 native pop webview
    // - 普通浏览器：直接 window.close() 关闭由 window.open 打开的 tab；如被禁则跳转 about:blank 兜底
    function closeAfterAction() {
        if (window.IMJSBridge) {
            im.quit();
            return;
        }
        try { window.close(); } catch (e) { }
        setTimeout(function () {
            if (!window.closed) {
                window.location.href = 'about:blank';
            }
        }, 100);
    }

    $(function () {
        im.onReady();

        $.getJSON(`${apiURL}group/invites/${inviteNo}`).then(function (resp) {
            let data = resp;
            $(".avatar").attr('src', `${apiURL}users/${data.inviter}/avatar`);
            $(".inviter").text(data.inviter_name);
            $(".tip").text(`邀请${data.items.length}位朋友加入群聊`);
            if (data.remark && data.remark != '') {
                $(".remark").text(`"${data.remark}"`);
            }
            for (let i = 0; i < data.items.length; i++) {
                let item = data.items[i];
                let memberElem = $(`<div class="member">
                    <img src="${apiURL}users/${item.uid}/avatar">
                    <div class="name">${item.name}</div>
                </div>`)
                $('.members').append(memberElem);
            }
            if (data.status == 1) {
                $("#status").text('已通过此邀请');
                $("#actions").hide();
            } else if (data.status == 2) {
                $("#status").text('已拒绝此邀请');
                $("#actions").hide();
            } else {
                $("#ok").click(function () {
                    disableActions();
                    $.postJSON(`${apiURL}group/invite/sure?auth_code=${code}`).then(function (resp) {
                        closeAfterAction();
                    }).fail(function (e) {
                        $("#refuse").removeClass('disabled');
                        $("#ok").removeClass('disabled');
                    })
                });
                $("#refuse").click(function () {
                    // 注：原本使用 window.confirm 二次确认，但 iOS WKWebView 默认未实现
                    // runJavaScriptConfirmPanelWithMessage，confirm 直接返回 false 会导致拒绝按钮无反应；
                    // 这里直接执行拒绝并退出页面，避免端上行为不一致。
                    disableActions();
                    $.postJSON(`${apiURL}group/invite/refuse?auth_code=${code}`).then(function (resp) {
                        closeAfterAction();
                    }).fail(function (e) {
                        $("#refuse").removeClass('disabled');
                        $("#ok").removeClass('disabled');
                    })
                });
            }


        })

    })
</script>

</html>
